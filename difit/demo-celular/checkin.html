<div class="text-center py-8">
  <h1 class="text-5xl sm:text-6xl font-bold text-metroblue mb-6">Check-in</h1>
  
  <p class="text-xl text-gray-300 mb-8">¡Bienvenido de vuelta! Registra tu entrada al gimnasio.</p>

  <div class="max-w-sm mx-auto bg-gray-900/50 p-8 rounded-2xl border border-metroblue/30">
    <button class="w-full py-5 bg-metroblue hover:bg-blue-600 rounded-xl text-2xl font-bold mb-6">
      Escanear QR
    </button>

    <p class="text-gray-400 mb-4">o ingresa manualmente</p>
    
    <input type="text" placeholder="Código de miembro" 
      class="w-full p-4 bg-gray-800 border border-gray-700 rounded-xl text-white text-center text-xl mb-4 focus:outline-none focus:border-metroblue">

    <button class="w-full py-4 bg-metrogreen hover:bg-green-700 rounded-xl text-xl font-semibold">
      Confirmar entrada
    </button>
  </div>
</div>
